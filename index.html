<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soaked — App Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Design tokens lifted verbatim from `Soaked App Mockups.dc.html`.
   Varsity direction: jersey navy + cream, gold for the one action that matters,
   red for anything destructive or contested. */

:root {
  /* Core brand */
  --navy: #16256B;
  --navy-bright: #2440C7;
  --cream: #FCF7EA;
  --canvas: #F1ECDD;
  --gold: #FFB524;
  --red: #E8332A;
  --green: #12A66B;

  /* Team colors */
  --team-red: #E8332A;
  --team-green: #12A66B;
  --team-purple: #7C3AED;
  --team-blue: #1F79F5;
  --team-amber: #F0A500;
  --team-navy: #16256B;

  /* Accents / derived */
  --gold-light: #FFD37A;
  --gold-ink: #7A4E00;
  --gold-ink-soft: #6B4A00;
  --green-deep: #0E8F5C;
  --green-light: #17C77E;
  --green-ink: #0B6B45;
  --red-ink: #8C1F19;
  --red-soft: #F0A99C;
  --orange: #FF6A3D;

  /* Navy alphas — the workhorse ink scale on cream screens */
  --n-04: rgba(22, 37, 107, .04);
  --n-05: rgba(22, 37, 107, .05);
  --n-07: rgba(22, 37, 107, .07);
  --n-08: rgba(22, 37, 107, .08);
  --n-10: rgba(22, 37, 107, .10);
  --n-12: rgba(22, 37, 107, .12);
  --n-14: rgba(22, 37, 107, .14);
  --n-18: rgba(22, 37, 107, .18);
  --n-20: rgba(22, 37, 107, .20);
  --n-25: rgba(22, 37, 107, .25);
  --n-30: rgba(22, 37, 107, .30);
  --n-35: rgba(22, 37, 107, .35);
  --n-40: rgba(22, 37, 107, .40);
  --n-45: rgba(22, 37, 107, .45);
  --n-50: rgba(22, 37, 107, .50);
  --n-55: rgba(22, 37, 107, .55);
  --n-60: rgba(22, 37, 107, .60);
  --n-70: rgba(22, 37, 107, .70);

  /* Cream alphas — the ink scale on navy screens */
  --c-35: rgba(252, 247, 234, .35);
  --c-40: rgba(252, 247, 234, .40);
  --c-45: rgba(252, 247, 234, .45);
  --c-50: rgba(252, 247, 234, .50);
  --c-55: rgba(252, 247, 234, .55);
  --c-60: rgba(252, 247, 234, .60);
  --c-65: rgba(252, 247, 234, .65);
  --c-70: rgba(252, 247, 234, .70);
  --c-75: rgba(252, 247, 234, .75);
  --c-80: rgba(252, 247, 234, .80);
  --c-06: rgba(252, 247, 234, .06);
  --c-07: rgba(252, 247, 234, .07);
  --c-12: rgba(252, 247, 234, .12);
  --c-14: rgba(252, 247, 234, .14);
  --c-16: rgba(252, 247, 234, .16);
  --c-18: rgba(252, 247, 234, .18);
  --c-22: rgba(252, 247, 234, .22);

  /* Type */
  --serif: 'Source Serif 4', Georgia, serif;
  --sans: Geist, system-ui, -apple-system, sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, monospace;

  /* Device */
  --device-w: 402px;
  --device-h: 874px;
  --device-radius: 48px;
}
/* ==========================================================================
   Soaked — implementation of `Soaked App Mockups.dc.html`
   Every value here is carried over from the mockup source.
   ========================================================================== */

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--canvas);
  font-family: var(--sans);
  color: var(--navy);
  -webkit-font-smoothing: antialiased;
}

/* ---------- Shell chrome (gallery + focus view) --------------------------- */

.shell-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  background: var(--navy);
  color: var(--cream);
  border-bottom: 1px solid rgba(0, 0, 0, .2);
}

.shell-bar__brand {
  font: 700 18px/1 var(--serif);
  letter-spacing: .04em;
}

.shell-bar__sub {
  font: 400 10px/1 var(--mono);
  letter-spacing: .12em;
  color: var(--c-55);
}

.shell-bar__spacer { flex: 1; }

.shell-btn {
  appearance: none;
  border: 1px solid var(--c-22);
  background: transparent;
  color: var(--cream);
  font: 500 11px/1 var(--mono);
  letter-spacing: .08em;
  padding: 8px 13px;
  border-radius: 8px;
  cursor: pointer;
}
.shell-btn:hover { border-color: var(--gold); color: var(--gold); }
.shell-btn[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--navy); }

.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 44px 34px;
  padding: 36px 44px 80px;
  align-items: flex-start;
}

.gallery__item {
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-margin-top: 80px;
}

.gallery__label {
  display: flex;
  align-items: baseline;
  gap: 9px;
  font: 400 11px/1.3 var(--sans);
  color: var(--n-60);
}

.gallery__id {
  font: 600 10.5px/1 var(--mono);
  padding: 3px 7px;
  background: var(--n-10);
  color: var(--navy);
  border-radius: 5px;
  text-decoration: none;
}
.gallery__item:target .gallery__id,
.gallery__item.is-active .gallery__id { background: var(--red); color: #fff; }

.focus-stage {
  display: flex;
  justify-content: center;
  padding: 40px 24px 80px;
}

/* ---------- iOS device frame (port of ios-frame.jsx) ---------------------- */

.ios-device {
  width: var(--device-w);
  height: var(--device-h);
  border-radius: var(--device-radius);
  overflow: hidden;
  position: relative;
  background: #F2F2F7;
  box-shadow: 0 40px 80px rgba(0, 0, 0, .18), 0 0 0 1px rgba(0, 0, 0, .12);
  font-family: -apple-system, system-ui, sans-serif;
  flex: none;
}
.ios-device--dark { background: #000; }

.ios-island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 37px;
  border-radius: 24px;
  background: #000;
  z-index: 50;
}

.ios-statusbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  gap: 154px;
  align-items: center;
  justify-content: center;
  padding: 21px 24px 19px;
  width: 100%;
  pointer-events: none;
}

.ios-statusbar__time {
  flex: 1;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 1.5px;
  font: 590 17px/22px -apple-system, 'SF Pro', system-ui;
  color: #000;
}

.ios-statusbar__icons {
  flex: 1;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding-top: 1px;
  padding-right: 1px;
}

.ios-device--dark .ios-statusbar__time { color: #fff; }

.ios-viewport {
  height: 100%;
  display: flex;
  flex-direction: column;
}
.ios-viewport > * { flex: 1; min-height: 0; }

.ios-home {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 60;
  height: 34px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 8px;
  pointer-events: none;
}
.ios-home__bar {
  width: 139px;
  height: 5px;
  border-radius: 100px;
  background: rgba(0, 0, 0, .25);
}
.ios-device--dark .ios-home__bar { background: rgba(255, 255, 255, .7); }

/* ---------- Screen base --------------------------------------------------- */

.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--cream);
  font-family: var(--sans);
  color: var(--navy);
}
.screen--navy {
  background: var(--navy);
  color: var(--cream);
  position: relative;
  overflow: hidden;
}

/* The diagonal jersey texture on the navy auth screens */
.jersey {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(115deg, rgba(252, 247, 234, .05) 0 14px, transparent 14px 34px);
}

.screen__body {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ---------- Placeholder textures ----------------------------------------- */
/* Photos and video are deliberately unshot — the mockups render them as
   diagonal hatch so nothing reads as real content. */

.hatch-av   { background: repeating-linear-gradient(135deg, #E4DCC4 0 5px, #F2ECDB 5px 10px); }
.hatch-vid  { background: repeating-linear-gradient(135deg, #E4DCC4 0 6px, #F2ECDB 6px 12px); }
.hatch-vid-lg { background: repeating-linear-gradient(135deg, #E4DCC4 0 7px, #F2ECDB 7px 14px); }
.hatch-navy { background: repeating-linear-gradient(135deg, #33459C 0 5px, #2A3A85 5px 10px); }
.hatch-qr   { background: repeating-linear-gradient(135deg, #16256B 0 3px, #FCF7EA 3px 6px); }
.hatch-card { background: repeating-linear-gradient(135deg, #E4DCC4 0 4px, #F2ECDB 4px 8px); }

.play-dot {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: rgba(22, 37, 107, .75);
}

/* ---------- Shared building blocks ---------------------------------------- */

.card {
  background: #fff;
  border: 1px solid var(--n-10);
  border-radius: 12px;
  overflow: hidden;
}

.mono-label {
  font: 500 10px/1 var(--mono);
  letter-spacing: .12em;
  color: var(--n-50);
}

.field-label {
  font: 400 9.5px/1 var(--mono);
  letter-spacing: .12em;
  color: var(--c-50);
  margin-bottom: 7px;
}

.field {
  height: 52px;
  border-radius: 11px;
  background: var(--c-07);
  border: 1px solid var(--c-18);
  display: flex;
  align-items: center;
  padding: 0 14px;
  font: 400 14px/1 var(--sans);
}
.field--focus { border-color: var(--gold); }
.field--split { justify-content: space-between; }

/* The one gold action per screen, bottom-anchored and thumb-sized */
.cta {
  height: 56px;
  border-radius: 12px;
  background: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 15px/1 var(--serif);
  letter-spacing: .1em;
  color: var(--navy);
  border: 0;
  width: 100%;
  cursor: pointer;
  font-family: var(--serif);
}
.cta--muted {
  background: var(--c-14);
  color: var(--c-45);
  cursor: default;
}
.cta--muted-ink {
  background: var(--n-12);
  color: var(--n-40);
  cursor: default;
}
.cta--navy { background: var(--navy); color: var(--cream); }
.cta--red { background: var(--red); color: var(--cream); letter-spacing: .08em; }

.chip {
  padding: 7px 12px;
  border-radius: 99px;
  font: 500 11.5px/1 var(--sans);
  border: 1px solid var(--c-35);
  cursor: pointer;
  background: transparent;
  color: inherit;
  font-family: var(--sans);
}
.chip--on {
  background: var(--cream);
  color: var(--navy);
  font-weight: 600;
  border-color: transparent;
}

.hdr {
  padding: 56px 20px 14px;
  background: linear-gradient(120deg, var(--navy), var(--navy-bright));
  color: var(--cream);
}
.hdr__title { font: 700 28px/1.1 var(--serif); }
.hdr__chips { display: flex; gap: 7px; margin-top: 14px; }

.team-bar {
  width: 4px;
  align-self: stretch;
  border-radius: 2px;
}
.team-dot {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  flex: none;
}

.status-pill {
  padding: 4px 8px;
  border-radius: 5px;
  font: 600 9px/1 var(--mono);
}
.status-pill--alive { background: rgba(18, 166, 107, .14); color: var(--green-ink); }
.status-pill--out { background: var(--n-08); color: var(--n-55); }

.is-out { opacity: .6; }
.is-out .name { text-decoration: line-through; }

.row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--n-07);
}
.row:last-child { border-bottom: 0; }

.avatar {
  border-radius: 50%;
  flex: none;
}

.chev { font: 400 16px/1 var(--sans); color: var(--n-30); }

/* ---------- Tab bar ------------------------------------------------------- */

.tabbar {
  display: flex;
  justify-content: space-between;
  padding: 13px 22px 34px;
  border-top: 1px solid var(--n-10);
  background: #fff;
  flex: none;
}

.tab {
  text-align: center;
  color: var(--n-42, rgba(22, 37, 107, .42));
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font-family: var(--mono);
}
.tab__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: transparent;
  margin: 0 auto 6px;
}
.tab__label {
  font: 500 9.5px/1 var(--mono);
  letter-spacing: .06em;
}
.tab--on { color: var(--navy); }
.tab--on .tab__dot { background: var(--red); }
.tab--on .tab__label { font-weight: 600; }

/* Interactive affordances — the mockups are flat, so keep this whisper-quiet */
[data-go] { cursor: pointer; }
[data-go]:hover { filter: brightness(.97); }
.tab:hover .tab__label { color: var(--navy); }

/* ==========================================================================
   Interactive form controls
   ========================================================================== */

/* Text inputs sit inside the existing .field wrapper and inherit its type. */
.inp {
  width: 100%;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: none;
  padding: 0;
  margin: 0;
  color: inherit;
  font: inherit;
  font-family: var(--sans);
}
.inp::placeholder { color: currentColor; opacity: .45; }
.inp[type="password"] { font-size: 17px; letter-spacing: .22em; }

/* Gold border on the focused field — the mockups' own focus signal. */
.field:focus-within { border-color: var(--gold); }

.field-line {
  height: 42px;
  border-radius: 10px;
  background: #fff;
  border: 1px solid var(--n-14);
  display: flex;
  align-items: center;
  padding: 0 14px;
  font: 400 13.5px/1 var(--sans);
  color: var(--navy);
}
.field-line:focus-within { border-color: var(--gold); }

.reveal {
  font: 500 11px/1 var(--mono);
  color: var(--c-55);
  cursor: pointer;
  user-select: none;
  flex: none;
  padding-left: 10px;
}

/* ---- Segmented code entry ------------------------------------------------ */

.codes { position: relative; display: flex; gap: 8px; }

.codes__in {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  border: 0;
  padding: 0;
  margin: 0;
  z-index: 2;
  cursor: text;
  font-size: 16px; /* keeps iOS from zooming on focus */
}

.code-box {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 26px/1 var(--serif);
}

/* Verify phone — navy screen */
.codes--navy .code-box {
  height: 62px;
  border-radius: 11px;
  background: var(--c-07);
  border: 1px solid rgba(252, 247, 234, .14);
  color: var(--cream);
}
.codes--navy .code-box--on { border-color: rgba(252, 247, 234, .2); }
.codes--navy .code-box--next { border-color: var(--gold); }

/* Join game — cream screen */
.codes--light .code-box {
  height: 60px;
  border-radius: 10px;
  background: #fff;
  border: 1px solid var(--n-14);
  color: var(--navy);
}
.codes--light .code-box--on { border-color: var(--n-18); }
.codes--light .code-box--next { border: 2px solid var(--gold); }

.codes__in:focus + .code-box ~ .code-box--next,
.codes__in:focus ~ .code-box--next { box-shadow: 0 0 0 3px rgba(255, 181, 36, .22); }

/* ---- Selection controls -------------------------------------------------- */

.pick { cursor: pointer; }

/* Grade pills */
.pick--grade {
  flex: 1;
  height: 44px;
  border-radius: 10px;
  background: var(--c-07);
  border: 1px solid var(--c-18);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 600 13px/1 var(--sans);
}
.pick--grade.is-on { background: rgba(255, 181, 36, .18); border-color: var(--gold); }

/* Payment methods */
.pick--pay {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #fff;
  border: 1px solid var(--n-12);
}
.pick--pay.is-on { border: 2px solid var(--gold); padding: 11px 13px; }
.pick--pay .pick__tick { display: none; }
.pick--pay.is-on .pick__tick {
  display: flex;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--gold);
  align-items: center;
  justify-content: center;
  font: 700 11px/1 var(--sans);
  color: var(--navy);
}

/* Team color swatches */
.pick--swatch { width: 44px; height: 44px; border-radius: 10px; }
.pick--swatch.is-on { box-shadow: 0 0 0 2px var(--cream), 0 0 0 4px var(--navy); }
.pick--swatch.is-taken { opacity: .35; cursor: not-allowed; }

/* Filter chips */
.pick--chip {
  padding: 7px 12px;
  border-radius: 99px;
  font: 500 11.5px/1 var(--sans);
  border: 1px solid var(--c-35);
}
.pick--chip.is-on { background: var(--cream); color: var(--navy); font-weight: 600; border-color: transparent; }

/* Consent checkbox */
.cbx {
  width: 15px;
  height: 15px;
  border-radius: 4px;
  border: 1px solid var(--c-50);
  flex: none;
  margin-top: 1px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cbx__tick { display: none; font: 700 10px/1 var(--sans); color: var(--navy); }
.cbx.is-on { background: var(--gold); border-color: var(--gold); }
.cbx.is-on .cbx__tick { display: block; }

/* A gated CTA that isn't ready yet shouldn't look clickable. */
.cta:disabled { cursor: default; }

/* Empty-state row for a search that matches nothing */
.empty {
  padding: 22px 14px;
  text-align: center;
  font: 400 12px/1.5 var(--sans);
  color: var(--n-50);
}

.inp--teamname { font: 600 15px/1 var(--sans); color: var(--navy); }

/* ---- One-time code ------------------------------------------------------- */

.form-error {
  text-align: center;
  font: 500 11.5px/1.45 var(--sans);
  color: var(--red-soft);
  margin-top: 12px;
}
.form-error--left { text-align: left; margin-top: 10px; }

/* Local mode has no carrier, so the generated code is shown instead of sent.
   Loud on purpose — this must never be mistaken for real delivery. */
.dev-code {
  margin-top: 22px;
  padding: 13px 15px;
  border-radius: 11px;
  background: rgba(255, 181, 36, .12);
  border: 1px dashed rgba(255, 181, 36, .55);
}
.dev-code__tag {
  font: 500 9px/1 var(--mono);
  letter-spacing: .12em;
  color: var(--gold-light);
}
.dev-code__val {
  font: 700 30px/1 var(--serif);
  letter-spacing: .18em;
  color: var(--cream);
  margin-top: 9px;
}
.dev-code__note {
  font: 400 10.5px/1.45 var(--sans);
  color: var(--c-60);
  margin-top: 8px;
}

/* ---- Toast --------------------------------------------------------------- */

.toast {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 96px;
  z-index: 70;
  padding: 12px 15px;
  border-radius: 12px;
  background: rgba(22, 37, 107, .95);
  color: var(--cream);
  font: 500 12.5px/1.45 var(--sans);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .22s ease, transform .22s ease;
  pointer-events: none;
}
.toast.is-in { opacity: 1; transform: translateY(0); }
.toast--todo {
  background: rgba(12, 18, 32, .95);
  border: 1px dashed rgba(255, 181, 36, .5);
  color: var(--gold-light);
}

.inp--chat { font: 400 13.5px/1 var(--sans); color: var(--navy); }

/* Wide letter-spacing suits password dots, not the placeholder text. */
.inp[type="password"]:placeholder-shown { font-size: 14px; letter-spacing: normal; }
</style>
</head>
<body>
<div id="shell-bar"></div>
<div id="root"></div>
<script>
/* Fixture data, transcribed from the mockups.
   Fictional brand, player-run game, no school affiliation — every name, team
   and roster here is placeholder, exactly as the design brief states. */

window.S = window.S || {};
window.S.screens = window.S.screens || {};

window.S.data = {
  game: {
    name: "Westside Soak '26",
    phase: 3,
    quota: 3,
    playersIn: 41,
    playersOut: 19,
    entryFee: 25,
    pot: 820
  },

  colors: {
    Undertow: '#E8332A',
    Riptide: '#12A66B',
    Kraken: '#7C3AED',
    Tide: '#1F79F5',
    Sandbar: '#F0A500'
  },

  // Home · top teams, and the source for Standings
  teams: [

    var act = e.target.closest('[data-action]');
    if (act) { runAction(act.getAttribute('data-action'), act); return; }

    var nav = e.target.closest('[data-nav]');
    if (nav) {
      var what = nav.getAttribute('data-nav');
      if (what === 'gallery') go(null);
      else if (what === 'first') go(ORDER[0]);
      else if (what === 'prev') step(-1);
      else if (what === 'next') step(1);
      return;
    }

    // In the gallery, clicking a device opens it; in focus mode, in-screen
    // controls route between screens.
    var open = e.target.closest('[data-open]');
    if (open && !currentId()) { go(open.getAttribute('data-open')); return; }

    var link = e.target.closest('[data-go]');
    if (link && currentId()) { go(link.getAttribute('data-go')); }
  }

  function onKey(e) {
    // Enter inside a field that declares an action fires it (chat send).
    if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-enter')) {
      e.preventDefault();
      runAction(e.target.getAttribute('data-enter'), e.target);
      return;
    }
    // Don't hijack arrow keys while someone is typing.
    if (e.target.tagName === 'INPUT') return;
    if (!current) return;
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'Escape') go(null);
  }

  /* ---- boot ------------------------------------------------------------- */

  function boot() {
    bar = document.getElementById('shell-bar');
    root = document.getElementById('root');
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    S.forms.bind(root, function (what, bindPath, caret) {
      if (what === 'repaint') render(bindPath, caret);
    });
    // Back/forward and hand-typed deep links sync state back from the hash.
    window.addEventListener('hashchange', function () {
      var id = idFromHash();
      if (id !== current) go(id);
    });
    current = idFromHash();
    render();

    // Ticks the resend cooldown / expiry line without re-rendering the screen.
    setInterval(function () {
      var el = root.querySelector('[data-otp-countdown]');
      if (!el || !S.otp.state.sentAt) return;
      var cd = S.otp.cooldownLeft();
      if (cd > 0) {
        el.textContent = 'RESEND IN 0:' + String(cd).padStart(2, '0');
      } else if (S.otp.isExpired()) {
        el.textContent = 'CODE EXPIRED';
      } else {
        var left = S.otp.secondsLeft();
        el.textContent = 'EXPIRES IN ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      }
    }, 1000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.S);
</script>
</body>
</html>
